
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.A.N.C.E Kingdom | Discord</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(ellipse at top, #293b5a 0%, transparent 60%),
                #101116;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 35px;
            text-align: center;
            background: rgba(25, 27, 35, 0.92);
            border: 1px solid #444957;
            border-radius: 18px;
            box-shadow: 0 15px 50px #0009;
        }

        .crown {
            font-size: 42px;
            margin-bottom: 12px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aeb6c7;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .divider {
            height: 2px;
            background: linear-gradient(
                to right,
                #263d67,
                #eee,
                #9b2929
            );
            margin: 20px 0;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 12px;
            background: #202127;
        }

        .footer {
            margin-top: 20px;
            color: #858b9b;
            font-size: 12px;
        }

        .footer span {
            color: #c5a46d;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="crown">♛</div>

        <h1>F.R.A.N.C.E</h1>
        <p class="subtitle">KINGDOM • COMMUNAUTÉ OFFICIELLE</p>

        <div class="divider"></div>

        <h2>Rejoindre le royaume</h2>
        <p class="subtitle">
            Retrouvez les membres, discutez et participez à la vie du royaume.
        </p>

        <iframe
            src="https://discord.com/widget?id=1568691039089336460&theme=dark"
            width="350"
            height="500"
            allowtransparency="true"
            frameborder="0"
            sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
        </iframe>

        <div class="footer">
            <span>F.R.A.N.C.E Kingdom</span> — Tous droits réservés
        </div>

    </main>

</body>
</html>
